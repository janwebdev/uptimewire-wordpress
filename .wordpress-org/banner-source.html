<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Onest; src: url(onest-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; }
body { width: 772px; height: 250px; overflow: hidden; background: #181c32; font-family: Onest, sans-serif; color: #f5f5f5; }
.wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 28px; padding: 0 56px; box-sizing: border-box; }
.wrap::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #f36e04; }
img { width: 132px; height: auto; flex: none; }
.name { font-size: 54px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.line { margin-top: 14px; font-size: 22px; font-weight: 500; color: #c4cada; line-height: 1.3; }
.line b { color: #fe990e; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
	<img src="shield.png" alt="">
	<div>
		<div class="name">UptimeWire</div>
		<div class="line">Website uptime &amp; SSL monitoring,<br>checked from outside, shown in WordPress.</div>
	</div>
</div>
</body>
</html>
