# Test stand for the plugin. Unique names so it never touches other stands:
#   docker compose -p uw-wp1 -f docker/compose.yaml up -d --build
#   docker compose -p uw-wp1 -f docker/compose.yaml down -v
name: uw-wp1

services:
  db:
    image: mariadb:11.4
    container_name: uw-wp1-db
    environment:
      MARIADB_ROOT_PASSWORD: stand-root
      MARIADB_DATABASE: wp74
      MARIADB_USER: wp
      MARIADB_PASSWORD: stand-wp
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - uw-wp1-db:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks: [uw-wp1-net]

  php74:
    build: { context: ., args: { PHP_VERSION: "7.4" } }
    image: uw-wp1-php74
    container_name: uw-wp1-php74
    depends_on: [db]
    ports: ["127.0.0.1:18741:80"]
    volumes:
      - uw-wp1-www74:/var/www/html
      - ..:/src:ro
    networks: [uw-wp1-net]

  php83:
    build: { context: ., args: { PHP_VERSION: "8.3" } }
    image: uw-wp1-php83
    container_name: uw-wp1-php83
    depends_on: [db]
    ports: ["127.0.0.1:18742:80"]
    volumes:
      - uw-wp1-www83:/var/www/html
      - ..:/src:ro
    networks: [uw-wp1-net]

volumes:
  uw-wp1-db: { name: uw-wp1-db }
  uw-wp1-www74: { name: uw-wp1-www74 }
  uw-wp1-www83: { name: uw-wp1-www83 }

networks:
  uw-wp1-net: { name: uw-wp1-net }
